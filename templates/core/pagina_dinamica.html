{% extends 'core/base.html' %}

{% block title %}{{ menu.titulo }} - Aderência Legislativa{% endblock %}

{% block content %}
<article class="bg-white rounded-md border border-slate-200 p-8 shadow-sm">
    <!-- Título Principal da Página -->
    <h1 class="text-3xl font-extrabold text-slate-900 mb-6 pb-4 border-b border-slate-100">
        {{ menu.titulo }}
    </h1>

    <!-- Conteúdo Markdown Renderizado -->
    <div class="prose prose-slate max-w-none 
                prose-headings:font-bold prose-headings:text-slate-900 
                prose-h1:text-2xl prose-h2:text-xl prose-h3:text-lg 
                prose-a:text-blue-600 prose-hr:border-slate-200">
        {{ menu.conteudo_html|safe }}
    </div>
</article>
{% endblock %}
